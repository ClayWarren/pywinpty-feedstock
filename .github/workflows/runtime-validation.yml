name: Pywinpty comparison of published Winpty builds
on:
  push:
    branches: [codex/winpty17-consumer-validation]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  runtime:
    if: github.repository == 'ClayWarren/pywinpty-feedstock'
    strategy:
      fail-fast: false
      matrix:
        winpty_build: ['4', 'h57928b3_5']
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install exact built package and test both terminal backends
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./ci/runtime.ps1 x64 ${{ matrix.winpty_build }}
